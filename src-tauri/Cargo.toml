[package]
name = "musicplayer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "musicplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = "9.0.0"
cpal = "0.18.2"
tauri-plugin-dialog = "2.8.3"
base64 = "0.23.1"
walkdir = "2.5.0"
nucleo-matcher = "0.3.1"
ringbuf = "0.4"
uuid = { version = "1.28.0", features = ["v4"] }
mpris-server = { version = "0.10", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = "2.5.4"
